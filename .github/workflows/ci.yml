name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Resolves the whole pub workspace (packages/* and app/).
      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test budget_core
        working-directory: packages/budget_core
        run: dart test

      - name: Test budget_migration
        working-directory: packages/budget_migration
        run: dart test

      - name: Test budget_simplefin
        working-directory: packages/budget_simplefin
        run: dart test

      - name: Test budget_mcp
        working-directory: packages/budget_mcp
        run: dart test

      - name: Test budget_sync
        working-directory: packages/budget_sync
        run: dart test

      - name: Test budget_store
        working-directory: packages/budget_store
        run: dart test

      - name: Test budget_cloud
        working-directory: packages/budget_cloud
        run: dart test

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      # The cloud MCP Worker (ADR 0004): types, then the compiled Dart tools
      # against a fake Drive with made-up data.
      - name: Check the cloud MCP Worker
        working-directory: mcp
        run: npm ci && npm run check && npm run smoke

      - name: Test app
        working-directory: app
        run: flutter test --coverage
